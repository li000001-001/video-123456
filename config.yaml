# ============================================================
# 视频分类助手 —— 全局配置（改这个文件即可，不要改代码）
# ============================================================

server:
  host: 0.0.0.0
  port: 8000
  # 允许跨域来源，* 表示全部
  cors: "*"
  # 访问口令：部署到公网后建议设置，例如访问 /?k=你的口令 一次即可记住
  # 留空表示不校验
  access_key: ""

storage:
  # 下载原片、成品、字幕存放目录（相对项目根目录）
  root: data
  # 成品保留小时数，超时自动清理（0 表示不清理）
  keep_hours: 72

# ---------- 下载与去水印 ----------
download:
  # 启用哪些平台（对应 platforms 目录下的解析器）
  platforms:
    - douyin
    - toutiao
    - kuaishou
    - bilibili
    - tiktok
    - x
  # 下载超时秒数
  timeout: 30
  # 单文件体积上限（MB）
  max_size_mb: 800
  # 可选代理，例如 http://127.0.0.1:7890
  proxy: ""
  # 可选 cookies 文件（Netscape 格式 cookies.txt），遇到「需要登录」时配置
  cookies_file: ""
  # 优先选择无水印源；失败时自动回退到最高画质
  prefer_no_watermark: true
  # 首选画质上限（1080/720/480），0 表示不限制
  max_height: 1080

# ---------- 分类识别 ----------
classify:
  # 低于该分数归入「其他」
  min_score: 3
  # 是否用 jieba 分词辅助匹配长词
  use_jieba: true
  # 标题权重 / 话题标签权重 / 简介权重 / 作者权重
  weight:
    title: 1.0
    tags: 1.4
    description: 0.6
    author: 0.4

# ---------- 60 秒跟看 ----------
watch:
  # 跟看时长与采样间隔（秒）
  duration_seconds: 60
  sample_interval_seconds: 5
  # 上传的内录 WAV 上限（MB）
  audio_max_mb: 4
  # 服务端分析后是否保留原始内录音频
  keep_audio: false
  # 语音转写 / 画面 OCR / 基础图像标签权重
  weight:
    transcript: 1.3
    ocr_text: 1.1
    visual_tags: 0.8

# ---------- 自动字幕 ----------
subtitle:
  enabled: true
  # 云端 Whisper 端点，留空则使用本地 faster-whisper
  # 例如 https://your-space.hf.space/transcribe
  remote_endpoint: ""
  remote_token: ""
  # 本地模型：tiny / base / small / medium
  model: base
  language: zh
  # 模型缓存目录
  model_dir: data/models
  # 单条视频最长处理秒数，超出则只转前 N 秒（0 不限制）
  max_seconds: 600

# ---------- 自动配音 ----------
dubbing:
  enabled: true
  # edge-tts 中文音色，可选：
  # zh-CN-XiaoxiaoNeural（女） zh-CN-YunxiNeural（男）
  # zh-CN-XiaoyiNeural（女） zh-CN-YunjianNeural（男·解说）
  voice: zh-CN-XiaoxiaoNeural
  # 语速 / 音量，如 +10% / -5%
  rate: "+0%"
  volume: "+0%"

# ---------- 视频合成 ----------
media:
  # 指定 ffmpeg 路径，留空自动使用 imageio-ffmpeg 自带二进制
  ffmpeg: ""
  # 是否把字幕烧进画面（true 硬字幕，false 仅生成 srt 文件）
  burn_subtitle: true
  # 字幕字号
  subtitle_font_size: 22

# ---------- 无障碍自动识别（原生 App 连接用） ----------
bridge:
  # 原生端上报接口需要的令牌，留空不校验
  token: ""
